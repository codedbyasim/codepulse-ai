<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodePulse AI - Repository Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              github: {
                dark: '#0d1117',
                card: '#161b22',
                border: '#30363d',
                text: '#c9d1d9',
                accent: '#58a6ff',
                button: '#238636',
                buttonHover: '#2ea043',
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-in-out',
              'fade-in-up': 'fadeInUp 0.5s ease-out',
              'grid-shift': 'grid-shift 30s linear infinite',
              'blob': 'blob 7s infinite',
              'node-pulse': 'node-pulse 3s ease-in-out infinite',
              'node-pulse-fast': 'node-pulse-fast 1.5s ease-in-out infinite',
              'ripple-pulse': 'ripple-pulse 2s ease-in-out infinite',
              'propagate-ripple': 'propagate-ripple 1.2s ease-out forwards',
              'pulse-line': 'pulse-line 2s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'grid-shift': {
                '0%': { transform: 'translate(0, 0)' },
                '100%': { transform: 'translate(60px, 60px)' },
              },
              blob: {
                '0%, 100%': { transform: 'translate(0, 0) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
              },
              'node-pulse': {
                '0%, 100%': { opacity: '0.6' },
                '50%': { opacity: '0.9' },
              },
              'node-pulse-fast': {
                '0%, 100%': { opacity: '0.7' },
                '50%': { opacity: '1' },
              },
              'ripple-pulse': {
                '0%, 100%': { opacity: '0.4' },
                '50%': { opacity: '0.8' },
              },
              'propagate-ripple': {
                '0%': { opacity: '0.8' },
                '100%': { opacity: '0' },
              },
              'pulse-line': {
                '0%, 100%': { opacity: '0.4' },
                '50%': { opacity: '0.8' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Base styles handled by Tailwind classes in App.tsx now */
      body {
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #30363d; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #58a6ff; 
      }
      .dark ::-webkit-scrollbar-track {
        background: #0d1117;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.1/",
    "react": "https://esm.sh/react@^19.2.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.1/",
    "mermaid": "https://esm.sh/mermaid@11.4.1",
    "diff": "https://esm.sh/diff@5.1.0",
    "marked": "https://esm.sh/marked@12.0.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
